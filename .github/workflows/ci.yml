name: CI NexusMarket Enterprise Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build, Test & Verify (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20 (Frontend Test Runner & Static Server)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Frontend Automated Test Suite
        run: cd frontend && npm test

      - name: Make Maven Wrapper Executable
        run: chmod +x nexusmarket/mvnw

      - name: Compile Source & Test Code
        run: ./nexusmarket/mvnw -B -f nexusmarket/pom.xml clean test-compile

      - name: Execute Automated Test Suite
        run: ./nexusmarket/mvnw -B -f nexusmarket/pom.xml test

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: nexusmarket/target/surefire-reports/

      - name: Package Executable JAR
        run: ./nexusmarket/mvnw -B -f nexusmarket/pom.xml package -DskipTests

      - name: Upload Packaged JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusmarket-jar
          path: nexusmarket/target/nexusmarket-domain-1.0.0.jar

      - name: Verify Docker Image Build
        run: docker build -t nexusmarket-backend:ci ./nexusmarket
