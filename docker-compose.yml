services:
  # Relational Database: Microsoft SQL Server 2022
  nexusmarket-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexusmarket-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env o variables de entorno}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('NexusMarket') IS NULL CREATE DATABASE NexusMarket; SELECT 1;\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped
    networks:
      - nexusmarket-net

  # NoSQL Database: MongoDB for Audit & Operations
  nexusmarket-mongo:
    image: mongo:7.0
    container_name: nexusmarket-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-nexus_admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?Defina MONGO_INITDB_ROOT_PASSWORD en .env o variables de entorno}"
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-nexusmarket_audit}"
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - nexusmarket-net

  # NexusMarket Microservice
  nexusmarket-app:
    build:
      context: ./nexusmarket
      dockerfile: Dockerfile
    container_name: nexusmarket-service
    depends_on:
      nexusmarket-db:
        condition: service_healthy
      nexusmarket-mongo:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      DB_URL: "${DB_URL:-jdbc:sqlserver://nexusmarket-db:1433;databaseName=NexusMarket;encrypt=true;trustServerCertificate=true}"
      DB_USERNAME: "${DB_USERNAME:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:-${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD o DB_PASSWORD en .env}}"
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:sqlserver://nexusmarket-db:1433;databaseName=NexusMarket;encrypt=true;trustServerCertificate=true}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-sa}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD o SPRING_DATASOURCE_PASSWORD en .env}}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}"
      SPRING_SQL_INIT_MODE: "${SPRING_SQL_INIT_MODE:-always}"
      SPRING_DATA_MONGODB_URI: "${SPRING_DATA_MONGODB_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-nexus_admin}:${MONGO_INITDB_ROOT_PASSWORD:?Defina MONGO_INITDB_ROOT_PASSWORD en .env}@nexusmarket-mongo:27017/${MONGO_INITDB_DATABASE:-nexusmarket_audit}?authSource=admin}"
      SECURITY_JWT_SECRET: "${SECURITY_JWT_SECRET:?Defina SECURITY_JWT_SECRET (minimo 32 bytes) en .env o variables de entorno}"
      SECURITY_JWT_EXPIRATION_SECONDS: "${SECURITY_JWT_EXPIRATION_SECONDS:-86400}"
      NEXUSMARKET_ORDERS_TTL_MINUTES: "${NEXUSMARKET_ORDERS_TTL_MINUTES:-30}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
    networks:
      - nexusmarket-net

volumes:
  sqlserver-data:
  mongodb-data:

networks:
  nexusmarket-net:
    driver: bridge
