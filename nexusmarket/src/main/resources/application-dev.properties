# =============================================================================
# NexusMarket - Perfil de Desarrollo Local (dev)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=NexusMarket;encrypt=true;trustServerCertificate=true}}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema-sqlserver.sql
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/nexusmarket_audit}
security.jwt.secret=${SECURITY_JWT_SECRET:NexusMarketDevOnlyJwtSecretKey2026LocalDevelopment32Bytes}
