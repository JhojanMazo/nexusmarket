# =============================================================================
# NexusMarket - Configuracion Base (Por defecto: perfil dev si no se especifica)
# =============================================================================
spring.application.name=nexusmarket
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

# Conexion Relacional (Microsoft SQL Server)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=NexusMarket;encrypt=true;trustServerCertificate=true}}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# JPA & Hibernate: conservar datos existentes sin recrear ni destruir tablas
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false

# Inicializacion idempotente del esquema SQL Server (IF OBJECT_ID IS NULL CREATE TABLE)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema-sqlserver.sql
spring.sql.init.continue-on-error=false

# Conexion NoSQL para Auditoria y Operaciones (MongoDB)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/nexusmarket_audit}

# Seguridad JWT parametrizada por entorno (en perfil prod se exige variable externa segura)
security.jwt.secret=${SECURITY_JWT_SECRET:NexusMarketDevOnlyJwtSecretKey2026LocalDevelopment32Bytes}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:86400}

# Actuator & Healthchecks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# TTL para cancelacion automatica de ordenes pendientes de pago (en minutos)
nexusmarket.orders.ttl-minutes=${NEXUSMARKET_ORDERS_TTL_MINUTES:30}
