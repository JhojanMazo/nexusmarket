# Aplicacion NexusMarket
spring.application.name=nexusmarket

# Conexion a SQL Server en Docker
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=NexusMarket;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA: no modificar automaticamente las tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
