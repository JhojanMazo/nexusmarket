name: CI NexusMarket Enterprise Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x nexusmarket/mvnw

      - name: Run Test Suite
        run: cd nexusmarket && ./mvnw clean test

      - name: Package JAR
        run: cd nexusmarket && ./mvnw package -DskipTests

      - name: Build Docker Image
        run: docker build -t nexusmarket-backend:latest ./nexusmarket
