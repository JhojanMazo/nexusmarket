# =============================================================================
# NexusMarket - Perfil de Produccion / Contenedores Docker (prod)
# Todos los secretos criticos DEBEN inyectarse por variables de entorno.
# ProductionSecurityValidator verifica en el arranque que no esten vacios ni
# utilicen valores de ejemplo o desarrollo.
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:sqlserver://nexusmarket-db:1433;databaseName=NexusMarket;encrypt=true;trustServerCertificate=true}}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# En produccion se prohibe destruir tablas existentes; el esquema se asegura de forma idempotente
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema-sqlserver.sql

# MongoDB y JWT sin secretos por defecto en produccion
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:}
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:86400}

management.endpoint.health.show-details=never
